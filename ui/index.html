<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body class="shell-body">
    <!-- DSH UI（iframe，就绪后加载）；
         allow 委派剪贴板权限：跨源 iframe 默认不允许 clipboard-write，
         否则 DSH UI 的「复制代码块」按钮点击无效 -->
    <iframe
      id="app-frame"
      class="app-frame"
      title="DeepSeek Harness"
      allow="clipboard-read; clipboard-write"
    ></iframe>

    <!-- 启动遮罩（就绪前显示状态） -->
    <div id="boot-mask" class="boot-mask">
      <img src="/logo.png" class="splash-logo" alt="DeepSeek Harness" />
      <h1 class="splash-title">DeepSeek Harness</h1>
      <div id="phase-text" class="splash-status">正在启动…</div>
      <div class="spinner" id="spinner"></div>
      <!-- 启动阶段 console 输出（可输入，就绪后随遮罩隐藏） -->
      <div id="boot-terminal" class="boot-terminal"></div>
      <div id="error-box" class="error-box" hidden>
        <div id="error-text" class="error-text"></div>
        <div class="error-actions">
          <button id="btn-retry" class="btn">重新启动</button>
          <button id="btn-open-browser" class="btn">在浏览器中打开</button>
        </div>
      </div>
    </div>

    <!-- 右下角固定终端按钮 -->
    <button id="float-btn" class="float-btn" title="展开/收起终端" hidden>
      <span class="float-dot" id="float-dot"></span>
      <span class="float-text">终端</span>
    </button>

    <!-- 终端面板（点击按钮呼出/隐藏） -->
    <div id="panel" class="panel" hidden>
      <div class="panel-toolbar">
        <span class="panel-title">DeepSeek Harness 终端</span>
        <span id="panel-state" class="state-chip"></span>
        <span class="toolbar-spacer"></span>
        <button id="btn-zoom-out" class="tool-btn" title="缩小">−</button>
        <button id="btn-zoom-label" class="tool-btn zoom-label" title="重置为 100%">100%</button>
        <button id="btn-zoom-in" class="tool-btn" title="放大">＋</button>
        <button id="btn-restart" class="tool-btn" title="重新启动服务">⟳</button>
        <button id="btn-stop" class="tool-btn" title="停止服务">⏹</button>
        <button id="btn-settings" class="tool-btn" title="设置">⚙</button>
        <button id="btn-hide-panel" class="tool-btn" title="隐藏终端">—</button>
      </div>
      <div id="terminal" class="terminal"></div>
      <div id="panel-log" class="panel-log"></div>
    </div>

    <!-- 设置弹窗 -->
    <div id="settings-modal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-header">
          <span>设置</span>
          <button id="btn-close-settings" class="tool-btn">✕</button>
        </div>
        <div class="modal-body">
          <label class="field">
            <span>启动命令</span>
            <input id="cfg-command" type="text" spellcheck="false" />
          </label>
          <label class="field">
            <span>工作目录（= dsh workspace 根）</span>
            <div class="row">
              <input id="cfg-workdir" type="text" spellcheck="false" />
              <button id="btn-pick-dir" class="tool-btn">浏览…</button>
            </div>
          </label>
          <label class="field">
            <span>端口</span>
            <input id="cfg-port" type="number" min="1" max="65535" step="1" />
          </label>
          <label class="field">
            <span>就绪超时（秒，首次运行下载自动放宽到 30 分钟）</span>
            <input id="cfg-timeout" type="number" min="10" max="600" step="1" />
          </label>
          <div class="field-group">
            <span class="field-group-title">代理（下载 DeepSeek Harness 时）</span>
            <label class="field check">
              <input id="cfg-sysproxy" type="checkbox" />
              <span>使用系统代理设置</span>
            </label>
            <label class="field">
              <span>代理地址（关闭“使用系统代理”后生效，如 http://127.0.0.1:10808）</span>
              <input id="cfg-proxy" type="text" spellcheck="false" placeholder="http://127.0.0.1:10808" />
            </label>
          </div>
          <label class="field check">
            <input id="cfg-keepalive" type="checkbox" />
            <span>退出客户端后保持服务运行</span>
          </label>
          <label class="field check">
            <input id="cfg-autorestart" type="checkbox" />
            <span>服务崩溃后自动重启</span>
          </label>
        </div>
        <div class="modal-footer">
          <button id="btn-save-settings" class="btn primary">保存</button>
          <button id="btn-cancel-settings" class="btn">取消</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/shell.ts"></script>
  </body>
</html>
